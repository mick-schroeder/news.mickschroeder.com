version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Remove generated files restored from the old Gatsby build cache.
        - git clean -fdx -- .cache public
        - git restore --source=HEAD --worktree -- public
        - nvm install 22
        - nvm use 22
        - npm install -g pnpm@12.18.0
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm check
        - pnpm build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
