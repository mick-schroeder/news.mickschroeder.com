version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Version from .nvmrc
        - nvm install
        - nvm use
        - corepack enable
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm check
        - pnpm fetch-favicons
        - pnpm build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store/**/*
      - public/favicons/**/*
