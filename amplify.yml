version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - corepack enable
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm check
        - pnpm fetch-favicons
        - pnpm build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
